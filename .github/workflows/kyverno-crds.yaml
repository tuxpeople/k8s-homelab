---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Kyverno CRDs"

on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "renovate-kyverno-test"]
    paths:
      - "kubernetes/apps/security/kyverno/app/helmrelease.yaml"
      - "kubernetes/apps/security/kyverno/crds/**"
      - "scripts/generate_kyverno_crds.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate CRDs for Renovate
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Renovate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: "${{ github.event.pull_request.head.ref }}"
          repository: "${{ github.event.pull_request.head.repo.full_name }}"

      - name: Cache mise tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ hashFiles('.mise.toml') }}

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          cache: false

      - name: Regenerate Kyverno CRDs
        run: ./scripts/generate_kyverno_crds.sh --generate-only

      - name: Commit generated CRDs
        run: |
          if git diff --quiet -- kubernetes/apps/security/kyverno/crds/crds.yaml; then
            echo "Kyverno CRDs are already current."
            exit 0
          fi

          chart_version=$(yq '.spec.chart.spec.version' kubernetes/apps/security/kyverno/app/helmrelease.yaml)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- kubernetes/apps/security/kyverno/crds/crds.yaml
          git commit -m "chore(kyverno): generate CRDs for chart ${chart_version}"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  validate:
    name: Validate generated CRDs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.actor != 'renovate[bot]' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache mise tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ hashFiles('.mise.toml') }}

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          cache: false

      - name: Regenerate Kyverno CRDs
        run: ./scripts/generate_kyverno_crds.sh --generate-only

      - name: Verify generated CRDs are current
        run: |
          if ! git diff --quiet -- kubernetes/apps/security/kyverno/crds/crds.yaml; then
            echo "::error::Kyverno CRDs do not match the configured chart version."
            git diff --stat -- kubernetes/apps/security/kyverno/crds/crds.yaml
            exit 1
          fi
