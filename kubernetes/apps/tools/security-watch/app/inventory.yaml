# Manual inventory, only for what the collector cannot see. What runs in this
# cluster (Talos, Kubernetes, Cilium, cert-manager, Traefik, apps) comes from
# the inventory CronJob (sw-inventory.sh → POST /api/inventory/homelab).
# A manual entry here wins over a collected one for the same component.
# Keys under `components` are slugs from config.yaml; values are APP versions.

environments:
  - slug: homelab
    name: Homelab
    description: k8s-homelab (Talos) und homelab-automation (Proxmox, Docker-Hosts)
    components:
      # Proxmox VMs and Docker hosts (homelab-automation), as of 2026-11-19
      openbao: 2.7.2
      harbor: 2.16.0
      portainer: 2.45.3
      seaweedfs: "4.53"
      semaphore: 2.19.17
      atlantis: v0.49.0
      grafana: 13.3.1
      loki: 3.7.10
      prometheus: v3.16.0 # monitoring VM; wins over the agent in this cluster
      # Not covered: Flux (no detect rule yet), Pi-hole (Docker tag is not the core version)

  - slug: rancher-lab
    name: Rancher-Lab
    description: RKE2/Rancher-Cluster aus homelab-automation
    components:
      rancher: 2.15.3
      rke2: v1.36.6+rke2r1
      kubernetes: v1.36.6
      cert-manager: v1.19.3

  - slug: rancher-test
    name: Rancher Testinventar
    description: RKE2/Rancher-Cluster
    components:
      rancher: 2.13.5
      rke2: v1.34.5+rke2r1
      kubernetes: v1.34.5
      cert-manager: v1.20.2
      longhorn: 108.3.0-up1.11.1
