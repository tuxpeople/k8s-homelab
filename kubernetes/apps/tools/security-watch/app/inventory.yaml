# Manual inventory. A manual entry wins over collected versions for the same
# component, so only list what no source reports. Homelab versions come from
# two sources (POST /api/inventory/homelab):
#   - cluster: the inventory CronJob (sw-inventory.sh) for this cluster
#   - homelab-automation: `task software-versions:push` for VMs and Docker hosts
# Keys under `components` are slugs from config.yaml; values are APP versions.

environments:
  - slug: homelab
    name: Homelab
    description: k8s-homelab (Talos) und homelab-automation (Proxmox, Docker-Hosts)
    components: {}

  - slug: rancher-lab
    name: Rancher-Lab
    description: RKE2/Rancher-Cluster aus homelab-automation
    components: {}

  - slug: rancher-test
    name: Rancher (S)
    description: RKE2/Rancher-Cluster
    components:
      rancher: 2.13.5
      rke2: v1.34.5+rke2r1
      kubernetes: v1.34.5
      cert-manager: v1.20.2
      longhorn: 108.3.0-up1.11.1
