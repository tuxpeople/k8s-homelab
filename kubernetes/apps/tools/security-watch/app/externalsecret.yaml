---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: security-watch-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: security-watch-secrets
    template:
      engineVersion: v2
      data:
        # Own fine-grained token, read-only, public repositories only.
        # 1Password item "security-watch", field GITHUB_TOKEN.
        github-token: "{{ .GITHUB_TOKEN }}"
        # Shared by the app (INGEST_TOKEN_FILE) and the inventory CronJob.
        # 1Password item "security-watch", field INGEST_TOKEN (random, e.g. openssl rand -hex 32).
        ingest-token: "{{ .INGEST_TOKEN }}"
        # Litestream replica on SeaweedFS (MINIO_* names are historical, as in dorflade-mhd)
        litestream-minio-id: "{{ index . \"LITESTREAM-ACCESS-KEY\" }}"
        litestream-minio-key: "{{ index . \"LITESTREAM-ACCESS-SECRET\" }}"
        litestream-minio-endpoint: "{{ index . \"LITESTREAM-HOST\" }}"  # inkl. Protokoll
        litestream-minio-bucket: "litestream"
  dataFrom:
    - extract:
        key: security-watch
    - extract:
        key: k8s/turingpi/_shared/seaweedfs-litestream
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: openbao-shared
