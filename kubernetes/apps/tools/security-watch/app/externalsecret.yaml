---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: security-watch-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: security-watch-secrets
    template:
      engineVersion: v2
      data:
        # Own fine-grained token, read-only, public repositories only.
        # 1Password item "security-watch", field GITHUB_TOKEN.
        github-token: "{{ .GITHUB_TOKEN }}"
        litestream-minio-id: "{{ .AWS_ACCESS_KEY_ID }}"
        litestream-minio-key: "{{ .AWS_SECRET_ACCESS_KEY }}"
        litestream-minio-endpoint: "http://{{ .BUCKET_HOST }}"
        litestream-minio-bucket: "litestream"
  dataFrom:
    - extract:
        key: security-watch
    - extract:
        key: minio-lab
