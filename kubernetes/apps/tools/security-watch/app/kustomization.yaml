---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./litestream-configmap.yaml
  - ./externalsecret.yaml
configMapGenerator:
  - name: security-watch-values
    files:
      - values.yaml
  # Manual inventory until the collector script delivers it (plan, stage 4)
  - name: security-watch-inventory
    files:
      - inventory.yaml
generatorOptions:
  disableNameSuffixHash: true
