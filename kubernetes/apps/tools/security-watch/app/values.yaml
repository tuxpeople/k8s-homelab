# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-3.7.3/charts/other/app-template/values.schema.json

# Security Watch (tuxpeople/security-watch, private): web UI and the collector
# share one SQLite database in an emptyDir, replicated to SeaweedFS by Litestream
# (same pattern as dorflade-mhd). The collector runs as a second container
# instead of a CronJob, because an emptyDir cannot be shared between pods.
# The inventory CronJob is different: it only reads the cluster and pushes a
# report to the app's API (collector/sw-inventory.sh in security-watch).

controllers:
  security-watch:
    strategy: Recreate
    containers:
      app:
        image: &image
          repository: ghcr.io/tuxpeople/security-watch
          tag: 1.9.0
        env:
          TZ: ${TIMEZONE}
          DATA_DIR: /data
          INGEST_TOKEN_FILE: /secrets/ingest-token
          # Every /feeds/ URL needs ?token= (needs security-watch >= the release with /feeds/)
          FEED_TOKEN_FILE: /secrets/feed-token
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: &port 8080
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probes
        securityContext: &securityContext
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
            memory: 100Mi
          limits:
            memory: 256Mi
      collector:
        image: *image
        command: ["/opt/venv/bin/flask"]
        args: ["--app", "security_watch", "collect", "--interval", "3600"]
        env:
          TZ: ${TIMEZONE}
          DATA_DIR: /data
          INVENTORY_PATH: /config/inventory.yaml
          GITHUB_TOKEN_FILE: /secrets/github-token
        securityContext: *securityContext
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi
      litestream:
        image: &litestream
          repository: docker.io/litestream/litestream
          tag: 0.5.18
        args: ["replicate"]
        env: &litestreamEnv
          LITESTREAM_ACCESS_KEY_ID:
            valueFrom:
              secretKeyRef:
                name: security-watch-secrets
                key: litestream-minio-id
          LITESTREAM_SECRET_ACCESS_KEY:
            valueFrom:
              secretKeyRef:
                name: security-watch-secrets
                key: litestream-minio-key
          MINIO_ENDPOINT:
            valueFrom:
              secretKeyRef:
                name: security-watch-secrets
                key: litestream-minio-endpoint
          MINIO_BUCKET:
            valueFrom:
              secretKeyRef:
                name: security-watch-secrets
                key: litestream-minio-bucket
        resources:
          requests:
            cpu: 10m
            memory: 50Mi
          limits:
            cpu: 500m
            memory: 128Mi
    initContainers:
      01-litestream-restore:
        image: *litestream
        args:
          - restore
          - -if-db-not-exists
          - -if-replica-exists
          - /data/security-watch.sqlite
        env: *litestreamEnv

  # Reads what runs in the cluster (versions only, no Secrets) and pushes it to
  # POST /api/inventory/homelab. The script comes from the app itself, so it
  # always matches the app version.
  inventory:
    type: cronjob
    cronjob:
      schedule: "23 * * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistory: 1
      failedJobsHistory: 1
    serviceAccount:
      identifier: inventory
    containers:
      app:
        image:
          repository: docker.io/alpine/k8s
          tag: 1.37.2
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -euo pipefail
            base=http://security-watch.tools.svc.cluster.local:8080
            curl -fsS --retry 5 --retry-all-errors -o /tmp/sw-inventory.sh "$base/collector/sw-inventory.sh"
            bash /tmp/sw-inventory.sh --cluster k8s-homelab --push "$base/api/inventory/homelab?name=Homelab"
        env:
          HOME: /tmp
          SW_INGEST_TOKEN_FILE: /secrets/ingest-token
        securityContext: *securityContext
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi

defaultPodOptions:
  imagePullSecrets:
    - name: ghcr-pullsecret
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch

serviceAccount:
  extraServiceAccounts:
    inventory:
      create: true

# Read-only, and only what sw-inventory.sh needs: no Secrets, no ConfigMaps
rbac:
  roles:
    inventory:
      type: ClusterRole
      rules:
        - apiGroups: [""]
          resources: ["nodes", "pods"]
          verbs: ["list"]
        - apiGroups: ["apiextensions.k8s.io"]
          resources: ["customresourcedefinitions"]
          resourceNames: ["helmreleases.helm.toolkit.fluxcd.io"]
          verbs: ["get"]
        - apiGroups: ["helm.toolkit.fluxcd.io"]
          resources: ["helmreleases"]
          verbs: ["list"]
  bindings:
    inventory:
      type: ClusterRoleBinding
      roleRef:
        identifier: inventory
      subjects:
        - identifier: inventory

service:
  app:
    controller: security-watch
    ports:
      http:
        port: *port

# The app has no login of its own: internal only, and behind Authelia
ingress:
  app:
    enabled: true
    className: external
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: network-auth@kubernetescrd
      hajimari.io/icon: mdi:shield-search
      gatus.io/status-code: "401"
    hosts:
      - host: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: *port
    tls:
      - hosts:
          - *host
        secretName: ${SECRET_DOMAIN/./-}-production-tls

  # Inventory API for scripts in the LAN or tailnet (homelab-automation's
  # `task software-versions:push`): internal only, no Authelia; the app
  # checks the ingest token. Only /api/inventory/ is routed.
  api:
    enabled: true
    className: internal
    annotations:
      gatus.io/enabled: "false"
    hosts:
      - host: &apihost "{{ .Release.Name }}-api.${SECRET_DOMAIN}"
        paths:
          - path: /api/inventory/
            pathType: Prefix
            service:
              identifier: app
              port: *port
    tls:
      - hosts:
          - *apihost
        secretName: ${SECRET_DOMAIN/./-}-production-tls

  # Product feeds for feed readers outside the cluster: external, without
  # Authelia, only /feeds/produkt/. The app requires FEED_TOKEN (?token=).
  # Environment feeds (/feeds/umgebung/) stay behind Authelia; FreshRSS reads
  # them through the service inside the cluster.
  feeds:
    enabled: true
    className: external
    annotations:
      gatus.io/enabled: "false"
    hosts:
      - host: *host
        paths:
          - path: /feeds/produkt/
            pathType: Prefix
            service:
              identifier: app
              port: *port
    tls:
      - hosts:
          - *host
        secretName: ${SECRET_DOMAIN/./-}-production-tls

persistence:
  tmp:
    enabled: true
    type: emptyDir
  database:
    enabled: true
    type: emptyDir
    advancedMounts:
      security-watch:
        app:
          - path: /data
        collector:
          - path: /data
        litestream:
          - path: /data
        01-litestream-restore:
          - path: /data
  inventory:
    type: configMap
    name: security-watch-inventory
    advancedMounts:
      security-watch:
        collector:
          - path: /config
            readOnly: true
  secrets:
    type: secret
    name: security-watch-secrets
    advancedMounts:
      security-watch:
        app:
          - path: /secrets
            readOnly: true
        collector:
          - path: /secrets
            readOnly: true
      inventory:
        app:
          - path: /secrets
            readOnly: true
  litestream-config:
    type: configMap
    name: security-watch-litestream-config
    advancedMounts:
      security-watch:
        litestream:
          - subPath: litestream-replicate.yml
            path: /etc/litestream.yml
            readOnly: true
        01-litestream-restore:
          - subPath: litestream-restore.yml
            path: /etc/litestream.yml
            readOnly: true
