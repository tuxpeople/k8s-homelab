---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
configMapGenerator:
  - name: gatus-ep-reconciler-values
    files:
      - values.yaml
  - name: gatus-ep-reconciler-scripts
    files:
      - reconcile.sh=./scripts/reconcile.sh
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  disableNameSuffixHash: true
