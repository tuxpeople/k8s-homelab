---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./pvc.yaml
configMapGenerator:
  - name: calibre-web-values
    files:
      - values.yaml
  - name: calibre-web-workaround
    files:
      - run-workaround.sh
generatorOptions:
  disableNameSuffixHash: true
