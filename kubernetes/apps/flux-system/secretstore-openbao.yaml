---
# Identity for OpenBao Kubernetes auth (role external-secrets on mount
# kubernetes-turingpi, managed in homelab-automation/terraform/openbao).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-openbao
---
# OpenBao reviews logins with the client's own JWT (no reviewer token)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-openbao-flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: external-secrets-openbao
    namespace: flux-system
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://openbao.lab.tdeutsch.ch
      namespace: homelab
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes-turingpi
          role: external-secrets
          serviceAccountRef:
            name: external-secrets-openbao
