---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name unifi-dns-secret
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: *name
  # Fields: UNIFI_API_KEY, UNIFI_HOST
  dataFrom:
    - extract:
        key: k8s/turingpi/network/unifi-dns
