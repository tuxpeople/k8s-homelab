---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: python-ipam-tokens
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: python-ipam-tokens
    template:
      engineVersion: v2
      data:
        API_TOKENS: "{{ .password }}"
  dataFrom:
    - extract:
        key: python-ipam-token
