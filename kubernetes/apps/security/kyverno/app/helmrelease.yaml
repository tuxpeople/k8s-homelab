---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kyverno
spec:
  timeout: 15m
  chart:
    spec:
      chart: kyverno
      version: 3.8.2
      sourceRef:
        kind: HelmRepository
        name: kyverno-charts
        namespace: flux-system
  interval: 10m
  # timeout: 30m
  test:
    enable: false
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 5
      remediateLastFailure: true
    # Kyverno CRDs are rendered by the chart. Keep them when a controller
    # rollout fails so the retry does not start without its required APIs.
    cleanupOnFail: false
  rollback:
    timeout: 10m
    cleanupOnFail: false
  values:
    crds:
      install: false
      annotations:
        helm.sh/resource-policy: keep
    kyverno-api:
      annotations:
        helm.sh/resource-policy: keep
    grafana:
      enabled: true
    admissionController:
      replicas: 2
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      rbac:
        clusterRole:
          extraResources: &extraResources
            - apiGroups: ["*"]
              resources: ["*"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["namespaces"]
              verbs: ["get", "list", "watch", "update", "patch"]
      serviceMonitor:
        enabled: true
      resources:
        requests:
          cpu: 35m
          memory: 100Mi
        limits:
          memory: 256Mi
    backgroundController:
      rbac:
        clusterRole:
          extraResources: *extraResources
      resources:
        requests:
          cpu: 15m
          memory: 100Mi
        limits:
          memory: 256Mi
      serviceMonitor:
        enabled: true
    reportsController:
      rbac:
        clusterRole:
          extraResources: *extraResources
      serviceMonitor:
        enabled: true
      resources:
        requests:
          cpu: 23m
          memory: 100Mi
        limits:
          memory: 256Mi
    cleanupController:
      serviceMonitor:
        enabled: true
      resources:
        requests:
          cpu: 63m
          memory: 100Mi
        limits:
          memory: 256Mi
