---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kyverno-crds-source
spec:
  interval: 30m
  url: https://github.com/kyverno/kyverno.git
  ref:
    tag: v1.8.2
  ignore: |
    /*
    !/charts/kyverno/charts/crds/*
    # exclude all
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kyverno-crds
spec:
  timeout: 15m
  chart:
    spec:
      chart: charts/kyverno/charts/crds
      sourceRef:
        kind: GitRepository
        name: kyverno-crds-source
        namespace: security
  interval: 10m
  # timeout: 30m
  test:
    enable: false
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 5
      remediateLastFailure: true
    # Kyverno CRDs are rendered by the chart. Keep them when a controller
    # rollout fails so the retry does not start without its required APIs.
    cleanupOnFail: false
  rollback:
    timeout: 10m
    cleanupOnFail: false
