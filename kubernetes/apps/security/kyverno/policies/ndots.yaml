---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/mutatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: ndots
  annotations:
    policies.kyverno.io/title: Add ndots
    policies.kyverno.io/category: DNS Optimization
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The ndots value controls where DNS lookups are first performed in a cluster and needs to be set to a lower value than the default of 5 in
      some cases. This policy mutates all Pods to add the ndots option with a value of 1.
spec:
  # Keep Pod JSONPatch paths out of generated controller rules.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    namespaceSelector:
      matchExpressions:
        - key: kyverno.io/exclude
          operator: NotIn
          values:
            - "true"
        - key: kyverno.io/ndots
          operator: Exists
  matchConditions:
    - name: condition-0
      expression: |-
        object.metadata.?annotations["kyverno.io/exclude"].orValue("") != "true"
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          !has(object.spec.dnsConfig) ? [JSONPatch{op: "add", path: "/spec/dnsConfig", value: {"options": [{"name":
          "ndots", "value": "1"}]}}] : !has(object.spec.dnsConfig.options) ? [JSONPatch{op: "add", path: "/spec/dnsConfig/options",
          value: [{"name": "ndots", "value": "1"}]}] : [JSONPatch{op: "add", path: "/spec/dnsConfig/options", value:
          object.spec.dnsConfig.options.filter(o, o.name != "ndots") + [{"name": "ndots", "value": "1"}]}]
