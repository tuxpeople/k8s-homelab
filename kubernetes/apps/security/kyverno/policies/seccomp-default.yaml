---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/mutatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: seccomp-default
  annotations:
    policies.kyverno.io/title: Add Default Seccomp Profile
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Automatically sets seccompProfile: RuntimeDefault on Pod securityContext if not already defined. RuntimeDefault restricts kernel syscalls
      to a safe subset without requiring app-specific profiles. Will not overwrite explicitly configured profiles (e.g. Localhost or Unconfined).
      Skipped for namespaces labeled kyverno.io/exclude: "true".
spec:
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    namespaceSelector:
      matchExpressions:
        - key: kyverno.io/exclude
          operator: NotIn
          values:
            - "true"
  matchConditions:
    - name: condition-0
      expression: |-
        !object.spec.?securityContext.seccompProfile.hasValue()
    - name: condition-1
      expression: |-
        object.metadata.namespace != "kube-system"
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          !has(object.spec.securityContext) ? [JSONPatch{op: "add", path: "/spec/securityContext", value: {"seccompProfile":
          {"type": "RuntimeDefault"}}}] : [JSONPatch{op: "add", path: "/spec/securityContext/seccompProfile", value:
          {"type": "RuntimeDefault"}}]
