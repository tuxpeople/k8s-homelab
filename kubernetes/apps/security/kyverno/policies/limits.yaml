---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/mutatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: limits
  annotations:
    policies.kyverno.io/title: Remove CPU limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      This policy removes CPU limits from all Pods, except in system namespaces (kube-system, flux-system, security, cert-manager) where authors
      intentionally set limits. Skipped for namespaces labeled kyverno.io/exclude: "true".
spec:
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    namespaceSelector:
      matchExpressions:
        - key: kyverno.io/exclude
          operator: NotIn
          values:
            - "true"
  matchConditions:
    - name: condition-0
      expression: |-
        !(object.metadata.namespace in ["kube-system", "flux-system", "security", "cert-manager"])
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          object.spec.containers.map(c, object.spec.containers.indexOf(c))
          .filter(i, object.spec.containers[i].?resources.limits["cpu"].hasValue()).map(i,
          JSONPatch{op: "remove", path: "/spec/containers/" + string(i) + "/resources/limits/cpu"}) + object.spec.?initContainers.orValue([]).map(c,
          object.spec.initContainers.indexOf(c)).filter(i, object.spec.initContainers[i].?resources.limits["cpu"].hasValue()).map(i,
          JSONPatch{op: "remove", path: "/spec/initContainers/" + string(i) + "/resources/limits/cpu"})
