---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/mutatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: label-existing-namespaces
  annotations:
    policies.kyverno.io/title: Label Existing Namespaces
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: >-
      Automatically labels all Namespaces with goldilocks.fairwinds.com/enabled: "true" to enable Goldilocks VPA recommendations for all
      namespaces. Triggers on Namespace admission reviews and applies to existing namespaces in the background.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespaces
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          !has(object.metadata.labels) ? [JSONPatch{op: "add", path: "/metadata/labels", value: {"goldilocks.fairwinds.com/enabled":
          "true"}}] : [JSONPatch{op: "add", path: "/metadata/labels/goldilocks.fairwinds.com~1enabled", value: "true"}]
  evaluation:
    mutateExisting:
      enabled: true
