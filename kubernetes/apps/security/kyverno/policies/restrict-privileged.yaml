---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/validatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-privileged
  annotations:
    policies.kyverno.io/title: Restrict Privileged Containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Audits Pods running privileged containers or with hostPID/hostNetwork/hostIPC. The storage namespace is excluded as democratic-csi
      legitimately requires hostPID for iSCSI nsenter. Mode is Audit to avoid blocking legitimate workloads. Skipped for namespaces labeled
      kyverno.io/exclude: "true".
spec:
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    namespaceSelector:
      matchExpressions:
        - key: kyverno.io/exclude
          operator: NotIn
          values:
            - "true"
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConditions:
    - name: condition-0
      expression: |-
        !(object.metadata.namespace in ["kube-system", "storage"])
  validations:
    - expression: |-
        (object.spec.containers + object.spec.?initContainers.orValue([])).all(c, !c.?securityContext.privileged.orValue(false))
      message: Privileged containers are not allowed outside of kube-system and storage.
    - expression: |-
        !object.spec.?hostPID.orValue(false) && !object.spec.?hostNetwork.orValue(false) && !object.spec.?hostIPC.orValue(false)
      message: hostPID, hostNetwork and hostIPC are not allowed outside of kube-system and storage.
