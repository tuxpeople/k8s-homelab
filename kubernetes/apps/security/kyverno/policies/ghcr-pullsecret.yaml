---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/mutatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-ghcr-pullsecret
  annotations:
    policies.kyverno.io/title: Add GHCR Pull Secret
    policies.kyverno.io/category: Other
    policies.kyverno.io/description: >-
      Automatically injects imagePullSecrets for ghcr.io images. Requires the ghcr-pullsecret Secret to exist in the namespace (created by the
      ghcr-pullsecret ClusterExternalSecret).
spec:
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    namespaceSelector:
      matchExpressions:
        - key: kyverno.io/exclude
          operator: NotIn
          values:
            - "true"
  matchConditions:
    - name: condition-0
      expression: |-
        object.spec.containers.exists(c, c.image.startsWith("ghcr.io"))
    - name: condition-1
      expression: |-
        !has(object.spec.imagePullSecrets)
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          [JSONPatch{op: "add", path: "/spec/imagePullSecrets", value: [{"name": "ghcr-pullsecret"}]}]
  autogen:
    podControllers:
      controllers:
        - deployments
        - daemonsets
        - statefulsets
        - replicasets
        - replicationcontrollers
        - jobs
        - cronjobs
