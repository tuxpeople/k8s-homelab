---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/validatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-latest-tag
  annotations:
    policies.kyverno.io/title: Restrict Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Images using the "latest" tag or no tag at all cannot be tracked or updated by Renovate. This policy audits Pods using unversioned images.
      Skipped for namespaces labeled kyverno.io/exclude: "true".
spec:
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    namespaceSelector:
      matchExpressions:
        - key: kyverno.io/exclude
          operator: NotIn
          values:
            - "true"
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  validations:
    - expression: |-
        (object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])).all(c,
        c.image.contains(":"))
      message: An image tag is required.
    - expression: |-
        (object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])).all(c,
        !c.image.endsWith(":latest"))
      message: Using the mutable latest image tag is not allowed.
