---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/generatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: gatus-internal
  annotations:
    policies.kyverno.io/title: Generate gatus endpoints
    policies.kyverno.io/category: Monitoring
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Ingress
    policies.kyverno.io/description: >-
      This policy will automatically generate gatus endpoints for all Ingresses with the ingressClassName set to internal.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups:
          - networking.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - ingresses
    namespaceSelector:
      matchExpressions:
        - key: kyverno.io/exclude
          operator: NotIn
          values:
            - "true"
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConditions:
    - name: ingress-class
      expression: |-
        object.spec.?ingressClassName.orValue("") == "internal"
    - name: namespace
      expression: |-
        object.metadata.namespace != "test"
    - name: enabled
      expression: |-
        object.metadata.?annotations["gatus.io/enabled"].orValue("") != "false"
  variables:
    - name: host
      expression: |-
        object.metadata.?annotations["gatus.io/host"].orValue("") != "" ? object.metadata.?annotations["gatus.io/host"].orValue("")
        : object.spec.rules[0].host
    - name: name
      expression: |-
        object.metadata.?annotations["gatus.io/name"].orValue("") != "" ? object.metadata.?annotations["gatus.io/name"].orValue("")
        : object.metadata.name
    - name: path
      expression: |-
        object.metadata.?annotations["gatus.io/path"].orValue("") != "" ? object.metadata.?annotations["gatus.io/path"].orValue("")
        : object.spec.rules[0].http.paths[0].path
    - name: status
      expression: |-
        object.metadata.?annotations["gatus.io/status-code"].orValue("") != "" ? object.metadata.?annotations["gatus.io/status-code"].orValue("")
        : "200"
  generate:
    - expression: |-
        generator.Apply(object.metadata.namespace, [{"apiVersion": dyn("v1"), "kind": dyn("ConfigMap"), "metadata":
        dyn({"name": object.metadata.name + "-gatus-ep", "labels": {"gatus.io/enabled": "true"}}), "data": dyn({"config.yaml":
        "endpoints:\n  - name: " + variables.name + "\n    group: internal-kubernetes\n    url: https://" + variables.host
        + variables.path + "\n    interval: 2m\n    client:\n      dns-resolver: tcp://192.168.13.1:53\n    conditions:\n      - \"[STATUS] == "
        + variables.status + "\"\n    alerts:\n      - type: discord\n"})}])
