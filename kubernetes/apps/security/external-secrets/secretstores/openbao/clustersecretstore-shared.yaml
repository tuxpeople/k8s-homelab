---
# Identity for OpenBao Kubernetes auth (role external-secrets-shared on mount
# kubernetes-turingpi, managed in homelab-automation/terraform/openbao).
# Only reads kv/k8s/turingpi/_shared/*; namespace secrets use a SecretStore
# per namespace instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-openbao-shared
---
# OpenBao reviews logins with the client's own JWT (no reviewer token)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-openbao-shared
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: external-secrets-openbao-shared
    namespace: security
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-shared
spec:
  provider:
    vault:
      server: https://openbao.lab.tdeutsch.ch
      namespace: homelab
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes-turingpi
          role: external-secrets-shared
          serviceAccountRef:
            name: external-secrets-openbao-shared
            namespace: security
