---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app metrics-server
spec:
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
  interval: 10m
  timeout: 30m
  test:
    enable: false
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 5
      remediateLastFailure: true
    cleanupOnFail: true
  rollback:
    timeout: 10m
    cleanupOnFail: false
  values:
    args:
      - --kubelet-insecure-tls
      - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
      - --kubelet-use-node-status-port
      # CM4 kubelet responses can exceed 2s under load.
      - --metric-resolution=30s
      - --kubelet-request-timeout=10s
      # Health checks must not depend on a slow API authorization round trip.
      - --authorization-always-allow-paths=/metrics,/livez,/readyz,/healthz
    livenessProbe:
      initialDelaySeconds: 60
      timeoutSeconds: 5
      failureThreshold: 6
    readinessProbe:
      initialDelaySeconds: 30
      timeoutSeconds: 5
    metrics:
      enabled: true
    serviceMonitor:
      enabled: true
