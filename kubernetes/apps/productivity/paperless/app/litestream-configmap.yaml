---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/configmap_v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-litestream-config
data:
  # Replica in SeaweedFS (core1), endpoint and keys from OpenBao
  # k8s/turingpi/_shared/seaweedfs-litestream; retention: docs/backups.md
  litestream-replicate.yml: |
    dbs:
      - path: /data/db.sqlite3
        replicas:
          - name: minio
            type: s3
            endpoint: $${S3_ENDPOINT}
            bucket: $${S3_BUCKET}
            path: paperless
            region: $${S3_REGION}
            force-path-style: true
            retention: 168h
            snapshot-interval: 1h
            validation-interval: 24h
            sync-interval: 10s
  # Restore into an empty volume
  litestream-restore.yml: |
    dbs:
      - path: /data/db.sqlite3
        replicas:
          - name: minio
            type: s3
            endpoint: $${S3_ENDPOINT}
            bucket: $${S3_BUCKET}
            path: paperless
            region: $${S3_REGION}
            force-path-style: true
