---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
spec:
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: homepage
    template:
      engineVersion: v2
  # All fields are HOMEPAGE_VAR_* (arr API keys, paperless, Proxmox)
  dataFrom:
    - extract:
        key: k8s/turingpi/default/homepage
