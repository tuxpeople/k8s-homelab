---
# Per-namespace SecretStore for OpenBao (Kubernetes auth role external-secrets
# on mount kubernetes-turingpi, managed in homelab-automation/terraform/openbao).
# Each namespace only reads kv/k8s/turingpi/<namespace>/*.
# To add a namespace: include this component, add the namespace to the role in
# terraform/openbao/kubernetes.tf and the subject to the ClusterRoleBinding in
# apps/security/external-secrets/secretstores/openbao/auth-delegator.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-openbao
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://openbao.lab.tdeutsch.ch
      namespace: homelab
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes-turingpi
          role: external-secrets
          serviceAccountRef:
            name: external-secrets-openbao
